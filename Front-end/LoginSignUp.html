<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Register - SignDetect AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="LoginSignUp.css">
    <script type="module" src="Firebase auth.js"></script>
</head>
<body>
    <a href="index.html" class="auth-brand">
        <span class="logo-icon">🤟</span>
        <span>SignDetect AI</span>
    </a>

    <!-- Sign Up Form Container -->
    <div class="container" id="signup" style="display:none;">
        <h1 class="form-title">Create Account</h1>
        <p class="form-subtitle">Join the accessible sign language translation platform</p>
        
        <form method="post" action="">
            <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
            
            <div class="input-group">
                <input type="text" id="fName" placeholder="First Name" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="text" id="lName" placeholder="Last Name" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="email" id="rEmail" placeholder="Email Address" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" id="rPassword" placeholder="Create Password" required>
                <i class="fas fa-lock"></i>
            </div>
            <button class="btn" id="submitSignUp">Create Account</button>
        </form>

        <p class="or">or connect with</p>
        <div class="icons">
            <i class="fab fa-google" title="Google Sign In"></i>
            <i class="fab fa-github" title="GitHub Sign In"></i>
        </div>
        <div class="links">
            <p>Already have an account?</p>
            <button id="signInButton">Sign In</button>
        </div>
    </div>

    <!-- Sign In Form Container -->
    <div class="container" id="signIn">
        <h1 class="form-title">Welcome Back</h1>
        <p class="form-subtitle">Sign in to access your detection history and models</p>
        
        <form method="post" action="">
            <div id="signInMessage" class="messageDiv" style="display:none;"></div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <i class="fas fa-lock"></i>
            </div>
            <p class="recover">
                <a href="#">Forgot Password?</a>
            </p>
            <button class="btn" id="submitSignIn">Sign In</button>
        </form>

        <p class="or">or sign in with</p>
        <div class="icons">
            <i class="fab fa-google" title="Google Sign In"></i>
            <i class="fab fa-github" title="GitHub Sign In"></i>
        </div>
        <div class="links">
            <p>Don't have an account yet?</p>
            <button id="signUpButton">Create Account</button>
        </div>
    </div>

    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Return to Homepage</a>

    <script src="LoginSignUp.js"></script>
</body>
</html>
